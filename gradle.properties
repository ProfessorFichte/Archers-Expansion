# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Mod properties
mod_version = 3.0.0
maven_group = com.archers_expansion
archives_name = archers_expansion
enabled_platforms = fabric,forge

# Minecraft properties
minecraft_version = 1.20.1
minecraft_compat_version = 1.20.1
yarn_mappings = 1.20.1+build.1

# Dependencies
fabric_loader_version = 0.19.5
# Oldest loader this mod actually runs on. NOT the build version above -
# driving the manifest from that would over-declare the requirement.
fabric_loader_compat_version=0.14.21
fabric_api_version = 0.92.12+1.20.1
forge_version = 1.20.1-47.4.22
cloth_config_version=11.1.106
# Not used in code; Spell Engine requires it at runtime, so it is a dev-runtime pin only.
player_anim_version=1.0.2+1.19.4
# Modrinth maven coordinates: maven.modrinth:armor-model-api:<version>-<platform>
armor_model_api_version=1.0.0+1.20.1
# Modrinth maven coordinates: maven.modrinth:spell-power:<version>-<platform>
spell_power_version=1.6.0+1.20.1
# Modrinth maven coordinates: maven.modrinth:ranged-weapon-api:<version>-<platform>
ranged_weapon_api_version=2.3.4+1.20.1
# Modrinth maven coordinates: maven.modrinth:tiny-config:<version>-<platform>
tiny_config_version=3.1.0+1.20.1
mixin_extras_version=0.5.5
# Modrinth maven coordinates: maven.modrinth:structure-pool-api:<version>-<platform>
structure_pool_api_version=1.2.1+1.20.1
# Modrinth maven coordinates: maven.modrinth:spell-engine:<version>-<platform>
spell_engine_version=1.10.5+1.20.1
# Modrinth maven coordinates: maven.modrinth:more-rpg-library:<version>-<platform>
# Resolves once More RPG Library 2.7.2+1.20.1 is published (Fichte release tier 1).
more_rpg_library_version=2.7.2+1.20.1
# Modrinth maven coordinates: maven.modrinth:archers:<version>-<platform>
archers_version = 3.1.1+1.20.1
# Soft dependency, dev runtime only: supplies the `runes:crafting` recipe type More-RPG-Library's
# rune-altar recipes use.
# Modrinth maven coordinates: maven.modrinth:runes:<version>-<platform>
runes_version=1.3.2+1.20.1
# Dev runtime only: Archers declares BundleAPI mandatory on Forge (its quivers).
# com.github.TheRedBrain:bundle-api-<platform>:<version>, vendored under libs/maven (no remote artifact;
# Archers' production jar embeds it). See libs/maven/README.md.
bundle_api_version=1.1.0+1.20.1

# Fabric only
trinkets_version=3.7.2
cardinal_components_version=5.2.0
mod_menu_version=7.2.1

# Forge only
curios_version=5.14.1+1.20.1
